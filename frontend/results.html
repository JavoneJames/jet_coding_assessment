<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>JET Coding Assessment</title>
    <link href="/static/css/result.css" rel="stylesheet" />
    <script src="/static/js/result.js" defer></script>
  </head>
  <body>
    <h1>Results of Restaurants</h1>
    <div id="search-bar-container">
      <input type="text" id="search-bar" placeholder="Looking for anything?" />
    </div>
    <div id="ratings-display-div">
      <span>Rating</span>
      <div id="rating-options">
        <label> <input type="checkbox" name="rating" value="1" /> 1 Star </label>
        <label> <input type="checkbox" name="rating" value="2" /> 2 Stars </label>
        <label> <input type="checkbox" name="rating" value="3" /> 3 Stars </label>
        <label> <input type="checkbox" name="rating" value="4" /> 4 Stars </label>
        <label> <input type="checkbox" name="rating" value="5" /> 5 Stars </label>
      </div>
    </div>
    <div id="restaurants-display-div">
      <label id="display-error"></label>
      <ul id="results"></ul>
      <template id="restaurant-template">
        <li class="restaurant-item">
          <strong class="name"></strong><br />
          ★<span class="rating"></span><br />
          <span class="cuisines"></span><br />
          <span class="address"></span>
        </li>
      </template>
    </div>
  </body>
</html>
